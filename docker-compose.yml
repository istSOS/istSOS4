services:
  database:
    image: ghcr.io/istsos/istsos4/database:1.17
    restart: always
    container_name: istsos4-database
    mem_limit: ${POSTGRES_MEM_LIMIT:-0}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
        -c custom.network=${NETWORK:-0}
        -c custom.versioning=${VERSIONING:-0}
        -c custom.authorization=${AUTHORIZATION:-0}
        -c custom.duplicates=${DUPLICATES:-0}
        -c custom.epsg=${EPSG:-4326}
        -c custom.user=${ISTSOS_ADMIN:-admin}
        -c custom.password=${ISTSOS_ADMIN_PASSWORD:-admin}
        -c log_statement="all"
        -c log_destination="stderr"
        -c log_duration="on"
    ports:
      - ${POSTGRES_EXTERNAL_PORT}:5432
    volumes:
      - v-istsos4-database-data:/home/postgres/pgdata
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - istsos4-network

  api:
    image: ghcr.io/istsos/istsos4/api:1.40
    restart: always
    container_name: istsos4-api
    depends_on:
      database:
        condition: service_healthy
    environment:
      HOSTNAME: ${HOSTNAME}
      SUBPATH: ${SUBPATH}
      VERSION: ${VERSION}
      DEBUG: ${DEBUG}
      VERSIONING: ${VERSIONING}
      POSTGRES_DB: ${POSTGRES_DB}
      ISTSOS_ADMIN: ${ISTSOS_ADMIN}
      ISTSOS_ADMIN_PASSWORD: ${ISTSOS_ADMIN_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      PG_MAX_OVERFLOW: ${PG_MAX_OVERFLOW}
      PG_POOL_SIZE: ${PG_POOL_SIZE}
      PG_POOL_TIMEOUT: ${PG_POOL_TIMEOUT}
      COUNT_MODE: ${COUNT_MODE}
      COUNT_ESTIMATE_THRESHOLD: ${COUNT_ESTIMATE_THRESHOLD}
      TOP_VALUE: ${TOP_VALUE}
      PARTITION_CHUNK: ${PARTITION_CHUNK}
      REDIS: ${REDIS}
      EPSG: ${EPSG}
      AUTHORIZATION: ${AUTHORIZATION}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      ALGORITHM: ${ALGORITHM}
      ANONYMOUS_VIEWER: ${ANONYMOUS_VIEWER}
      NETWORK: ${NETWORK}
      ST_AGGREGATE: ${ST_AGGREGATE}
    command: uvicorn --timeout-keep-alive 75 --workers 2 --host 0.0.0.0 --port 5000 app.main:app
    ports:
      - ${EXTERNAL_PORT}:5000
    working_dir: /code
    networks:
      - istsos4-network

  aggregation:
    image: ghcr.io/istsos/istsos4/aggregation:aggregation-test
    restart: always
    container_name: istsos4-aggregation
    depends_on:
      api:
        condition: service_started
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-database}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-istsos}
      AGGREGATION_ENABLED: ${AGGREGATION_ENABLED:-0}
      AGGREGATION_SCHEDULE: "${AGGREGATION_SCHEDULE:-*/10 * * * *}"
      AGGREGATION_UTC_OFFSET_MINUTES: ${AGGREGATION_UTC_OFFSET_MINUTES:-60}
      AGGREGATION_RUN_ON_STARTUP: ${AGGREGATION_RUN_ON_STARTUP:-0}
      AGGREGATION_WRITE_BATCH_SIZE: ${AGGREGATION_WRITE_BATCH_SIZE:-2000}
      AGGREGATION_REQUEST_TIMEOUT_SECONDS: ${AGGREGATION_REQUEST_TIMEOUT_SECONDS:-30}
      AGGREGATION_LOG_RESULTS: ${AGGREGATION_LOG_RESULTS:-0}
      AGGREGATION_API_URL: ${AGGREGATION_API_URL:-http://api:5000${SUBPATH:-/istsos4}${VERSION:-/v1.1}}
      AUTHORIZATION: ${AUTHORIZATION:-0}
      ISTSOS_ADMIN: ${ISTSOS_ADMIN:-admin}
      ISTSOS_ADMIN_PASSWORD: ${ISTSOS_ADMIN_PASSWORD:-admin}
    stop_grace_period: 100s
    networks:
      - istsos4-network

  redis:
    image: redis:8.8.0-alpine3.23
    restart: always
    container_name: istsos4-redis
    volumes:
      - v-istsos4-redis-data:/data
    networks:
      - istsos4-network

  dummy_data:
    image: ghcr.io/istsos/istsos4/dummy_data:1.12
    restart: on-failure
    container_name: istsos4-dummy-data
    environment:
      HOSTNAME: ${HOSTNAME}
      SUBPATH: ${SUBPATH}
      VERSION: ${VERSION}
      VERSIONING: ${VERSIONING}
      POSTGRES_DB: ${POSTGRES_DB}
      ISTSOS_ADMIN: ${ISTSOS_ADMIN}
      ISTSOS_ADMIN_PASSWORD: ${ISTSOS_ADMIN_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      DUMMY_DATA: ${DUMMY_DATA}
      CLEAR_DATA: ${CLEAR_DATA}
      RESUME: ${RESUME:-0}
      N_THINGS: ${N_THINGS}
      N_OBSERVED_PROPERTIES: ${N_OBSERVED_PROPERTIES}
      CENTER_LAT: ${CENTER_LAT}
      CENTER_LON: ${CENTER_LON}
      SPREAD_DEG: ${SPREAD_DEG}
      INTERVAL: ${INTERVAL}
      FREQUENCY: ${FREQUENCY}
      START_DATETIME: ${START_DATETIME}
      CHUNK_INTERVAL: ${CHUNK_INTERVAL}
      BATCH_SIZE: ${BATCH_SIZE:-10000}
      LOG_INTERVAL_SECONDS: ${LOG_INTERVAL_SECONDS:-5}
      RANDOM_SEED: ${RANDOM_SEED:-}
      EPSG: ${EPSG}
      AUTHORIZATION: ${AUTHORIZATION}
      NETWORK: ${NETWORK}
      ST_AGGREGATE: ${ST_AGGREGATE}
    command: python3 generator.py
    working_dir: /dummy_data
    depends_on:
      database:
        condition: service_healthy
    networks:
      - istsos4-network

  qc:
    image: ghcr.io/istsos/istsos4/utils/qc:0.1
    build:
      context: ./utils
      dockerfile: services/qc/Dockerfile
    restart: always
    init: true
    container_name: istsos4-qc
    depends_on:
      - api
    environment:
      ENABLED: ${QC_ENABLED:-0}
      ISTSOS4_URL: http://api:5000${SUBPATH}${VERSION}
      # @iot.nextLink start with this: qc sends them to ISTSOS4_URL instead
      ISTSOS4_PUBLIC_URL: ${HOSTNAME}${SUBPATH}${VERSION}
      ISTSOS4_USERNAME: ${QC_USERNAME:-}
      ISTSOS4_PASSWORD: ${QC_PASSWORD:-}
      COMMIT_MESSAGE: ${QC_COMMIT_MESSAGE:-}
      INTERVAL_MINUTES: ${QC_INTERVAL_MINUTES:-10}
      OVERLAP_SECONDS: ${QC_OVERLAP_SECONDS:-60}
      DATASTREAMS: ${QC_DATASTREAMS:-}
      EXCLUDE_DATASTREAMS: ${QC_EXCLUDE_DATASTREAMS:-}
    volumes:
      - v-istsos4-qc-data:/data
    networks:
      - istsos4-network

networks:
  istsos4-network:
    name: istsos4-network

volumes:
  v-istsos4-database-data:
    name: v-istsos4-database-data
  v-istsos4-redis-data:
    name: v-istsos4-redis-data
  v-istsos4-qc-data:
    name: v-istsos4-qc-data
