services:
  database:
    image: ghcr.io/istsos/istsos4/database:1.17
    restart: always
    container_name: istsos4-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
        -c custom.network=${NETWORK:-0}
        -c custom.versioning=${VERSIONING:-0}
        -c custom.authorization=${AUTHORIZATION:-0}
        -c custom.duplicates=${DUPLICATES:-0}
        -c custom.epsg=${EPSG:-4326}
        -c custom.user=${ISTSOS_ADMIN:-admin}
        -c custom.password=${ISTSOS_ADMIN_PASSWORD:-admin}
        -c log_statement="all"
        -c log_destination="stderr"
        -c log_duration="on"
    ports:
      - ${POSTGRES_EXTERNAL_PORT}:5432
    volumes:
      - v-istsos4-database-data:/home/postgres/pgdata
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - istsos4-network

  api:
    image: ghcr.io/istsos/istsos4/api:1.37
    restart: always
    container_name: istsos4-api
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      HOSTNAME: ${HOSTNAME}
      SUBPATH: ${SUBPATH}
      VERSION: ${VERSION}
      DEBUG: ${DEBUG}
      VERSIONING: ${VERSIONING}
      POSTGRES_DB: ${POSTGRES_DB}
      ISTSOS_ADMIN: ${ISTSOS_ADMIN}
      ISTSOS_ADMIN_PASSWORD: ${ISTSOS_ADMIN_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      PG_MAX_OVERFLOW: ${PG_MAX_OVERFLOW}
      PG_POOL_SIZE: ${PG_POOL_SIZE}
      PG_POOL_TIMEOUT: ${PG_POOL_TIMEOUT}
      COUNT_MODE: ${COUNT_MODE}
      COUNT_ESTIMATE_THRESHOLD: ${COUNT_ESTIMATE_THRESHOLD}
      TOP_VALUE: ${TOP_VALUE}
      PARTITION_CHUNK: ${PARTITION_CHUNK}
      REDIS: ${REDIS}
      EPSG: ${EPSG}
      AUTHORIZATION: ${AUTHORIZATION}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      ALGORITHM: ${ALGORITHM}
      ANONYMOUS_VIEWER: ${ANONYMOUS_VIEWER}
      NETWORK: ${NETWORK}
      ST_AGGREGATE: ${ST_AGGREGATE}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HARVEST_INTERVAL_MINUTES: ${HARVEST_INTERVAL_MINUTES:-15}
      OPEN_CATALOG_METADATA: ${OPEN_CATALOG_METADATA:-1}
      CATALOG_CLOSED_NETWORKS: ${CATALOG_CLOSED_NETWORKS:-}
      STAC_TRANSFORMER: ${STAC_TRANSFORMER:-0}
      STAC_CATALOG_ID: ${STAC_CATALOG_ID:-}
      STAC_CATALOG_TITLE: ${STAC_CATALOG_TITLE:-}
      STAC_DEPLOYMENT_NAME: ${STAC_DEPLOYMENT_NAME:-}
      STAC_DEFAULT_LICENSE: ${STAC_DEFAULT_LICENSE:-}
      STAC_AUTH_DESCRIPTION: ${STAC_AUTH_DESCRIPTION:-}
      DCAT_TRANSFORMER: ${DCAT_TRANSFORMER:-0}
      DCAT_CATALOG_ID: ${DCAT_CATALOG_ID:-}
      DCAT_CATALOG_TITLE: ${DCAT_CATALOG_TITLE:-}
      DCAT_CATALOG_DESCRIPTION: ${DCAT_CATALOG_DESCRIPTION:-}
      DCAT_PUBLISHER_NAME: ${DCAT_PUBLISHER_NAME:-}
      DCAT_DEPLOYMENT_NAME: ${DCAT_DEPLOYMENT_NAME:-}
      DCAT_LANGUAGE: ${DCAT_LANGUAGE:-}
      DCAT_DEFAULT_LICENSE: ${DCAT_DEFAULT_LICENSE:-}
      DCAT_DEFAULT_ACCESS_RIGHTS: ${DCAT_DEFAULT_ACCESS_RIGHTS:-}
      DCAT_PUBLISHER_URI: ${DCAT_PUBLISHER_URI:-}
      DCAT_PUBLISHER_HOMEPAGE: ${DCAT_PUBLISHER_HOMEPAGE:-}
      DCAT_PUBLISHER_MBOX: ${DCAT_PUBLISHER_MBOX:-}
      DCAT_GEOMETRY_ENCODING: ${DCAT_GEOMETRY_ENCODING:-node}
    command: uvicorn --timeout-keep-alive 75 --workers 2 --host 0.0.0.0 --port 5000 app.main:app
    ports:
      - ${EXTERNAL_PORT}:5000
    working_dir: /code
    networks:
      - istsos4-network

  redis:
    image: redis:8.8.0-alpine3.23
    restart: always
    container_name: istsos4-redis
    volumes:
      - v-istsos4-redis-data:/data
    networks:
      - istsos4-network

  dummy_data:
    image: ghcr.io/istsos/istsos4/dummy_data:1.11
    restart: on-failure
    container_name: istsos4-dummy-data
    environment:
      HOSTNAME: ${HOSTNAME}
      SUBPATH: ${SUBPATH}
      VERSION: ${VERSION}
      VERSIONING: ${VERSIONING}
      POSTGRES_DB: ${POSTGRES_DB}
      ISTSOS_ADMIN: ${ISTSOS_ADMIN}
      ISTSOS_ADMIN_PASSWORD: ${ISTSOS_ADMIN_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      DUMMY_DATA: ${DUMMY_DATA}
      CLEAR_DATA: ${CLEAR_DATA}
      N_THINGS: ${N_THINGS}
      N_OBSERVED_PROPERTIES: ${N_OBSERVED_PROPERTIES}
      CENTER_LAT: ${CENTER_LAT}
      CENTER_LON: ${CENTER_LON}
      SPREAD_DEG: ${SPREAD_DEG}
      INTERVAL: ${INTERVAL}
      FREQUENCY: ${FREQUENCY}
      START_DATETIME: ${START_DATETIME}
      CHUNK_INTERVAL: ${CHUNK_INTERVAL}
      EPSG: ${EPSG}
      AUTHORIZATION: ${AUTHORIZATION}
      NETWORK: ${NETWORK}
      ST_AGGREGATE: ${ST_AGGREGATE}
    command: python3 generator.py
    working_dir: /dummy_data    
    depends_on:
      database:
        condition: service_healthy
    networks:
      - istsos4-network

networks:
  istsos4-network:
    name: istsos4-network
    
volumes:
  v-istsos4-database-data:
    name: v-istsos4-database-data
  v-istsos4-redis-data:
    name: v-istsos4-redis-data