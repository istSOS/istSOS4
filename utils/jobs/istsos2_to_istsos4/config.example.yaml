# Example: one job per istSOS2 service type, one procedure each.
# Copy into config/ and split it into one file per service, e.g.
# config/sosraw.yaml, config/sos.yaml, config/ext.yaml, config/figinoagg.yaml.
istsos:
  continue_on_error: true # a failing job is logged, the next one runs

  imports:
    # Raw in-situ data (sosraw service), all options shown.
    - name: sosraw_insitu
      enabled: false
      service: sosraw
      step_days: 7 # days read from istSOS2 per request
      start_date: # optional, e.g. 2024-01-01T00:00:00+01:00
      end_date: # optional
      aggregate: PT1H # optional ISO 8601 duration: mean per window
      override: true # patch existing istSOS4 observations instead of inserting
      datastreams:
        # PROCEDURE.observed-property: DATASTREAM
        P_LUMI.air-rainfall: Praw_LUMI

    # Virtual procedures (sos service).
    - name: sos_virtual
      enabled: false
      service: sos
      step_days: 7
      datastreams:
        Q_LAV_RSV.water-discharge: Q_LAV_RSV

    # Validated in-situ procedures (sos service).
    - name: sos_insitu
      enabled: false
      service: sos
      step_days: 7
      datastreams:
        A_LAV_RSV.water-height: WL_LAV_RSV

    # Stations no longer transmitting (sos service).
    - name: sos_offline
      enabled: false
      service: sos
      step_days: 30
      datastreams:
        A_CDRE_CVM.water-height: WL_CDRE_CVM

    # External providers (ext service).
    - name: ext
      enabled: false
      service: ext
      step_days: 7
      datastreams:
        Q_UFAM_TIC_BEL.river-discharge: Q_TIC_BEL

    # Aggregated data (figinoagg service).
    - name: figino
      enabled: false
      service: figinoagg
      step_days: 14
      datastreams:
        xt_0_4.water-temperature: WT_xt_0_4
